<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athena Practice</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    width:600px;
    margin:40px auto;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    font-size:16px;
}

button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    font-weight:bold;
}
</style>

</head>
<body>

<h2>Practice Database Insert</h2>

<label>Name</label>
<input type="text" id="tname">

<label>Description</label>
<input type="text" id="tdesc">

<button onclick="saveRecord()">Save</button>

<div id="result"></div>

<script>

const API_URL = "https://YOUR_API_GATEWAY_URL";

async function saveRecord(){

    const tname = document.getElementById("tname").value;
    const tdesc = document.getElementById("tdesc").value;

    const response = await fetch(API_URL,{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            tname:tname,
            tdesc:tdesc
        })
    });

    const result = await response.json();

    document.getElementById("result").innerHTML =
        "Status: " + result.Status;

}

</script>

</body>
</html>
