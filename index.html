<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athena Practice</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    width:600px;
    margin:40px auto;

}

a{
	display:block;
	margin-top:20px;
	color:blue;
	font-size:18px;
}

input{
    width:50%;
    padding:10px;
    margin-bottom:10px;

}

button{
    padding:10px 20px;

    margin-top:20px;

}
</style>

<body bgcolor = "#dfe6e9">

<h2>Practice Database Insert</h2>

<label>Name</label>
<br>
<input type="text" id="tname">
<br>
<label>Description</label>
<br>
<input type="text" id="tdesc">
<br>
<button onclick="saveRecord()">Submit</button>

<div id="result"></div>

<script>

const API_URL =
"https://7f6zejkel6.execute-api.us-east-1.amazonaws.com/default/lambdaTest";

async function saveRecord(){

    const tname = document.getElementById("tname").value;
    const tdesc = document.getElementById("tdesc").value;

    const response = await fetch(API_URL,{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            tname:tname,
            tdesc:tdesc
        })
    });

    const result = await response.json();

    document.getElementById("result").innerHTML =
        "Status: " + result.Status;

// Clear the fields if the save was successful 
document.getElementById("tname").value = "";
document.getElementById("tdesc").value = "";

document.getElementById("tname").focus();

}

</script>
